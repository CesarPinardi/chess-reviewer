<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Review your chess games with Stockfish in your browser.">
<title>Chess Reviewer</title>
<link rel="stylesheet" href="style.css">
<header><span class="logo" aria-hidden="true">♞</span><strong>Chess Reviewer</strong><button id="open" type="button">Import PGN</button></header>
<main>
  <section class="play" aria-label="Board and chart">
    <div class="player" id="top"></div>
    <div class="arena">
      <div class="meter" title="White's evaluation"><div id="balance"></div><span id="score">—</span></div>
      <div class="board-wrap"><div id="board" aria-label="Chessboard"></div><svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg><div id="move-mark" aria-hidden="true"></div></div>
    </div>
    <div class="player" id="bottom"></div>
    <div class="plot">
      <div class="plot-title"><strong>Game evaluation</strong><span>Stockfish 17.1</span></div>
      <canvas id="chart" aria-label="Evaluation chart. Use the move list to navigate with the keyboard."></canvas>
    </div>
  </section>
  <section class="review" aria-label="Game review">
    <div class="intro"><div class="caption">GAME ANALYSIS</div><h1>Game review</h1><p id="game"></p></div>
    <div class="actions"><button id="analyze" class="primary">Analyze game</button><progress id="progress" hidden></progress><p id="status" role="status"></p></div>
    <section id="report" class="report" aria-labelledby="report-title" hidden>
      <h2 id="report-title">Game summary</h2>
      <table>
        <thead><tr><th scope="col">Classification</th><th scope="col">White</th><th scope="col">Black</th></tr></thead>
        <tbody id="report-counts"></tbody>
      </table>
    </section>
    <div class="detail" id="detail" aria-live="polite"></div>
    <div class="practice"><button id="try-moves" type="button">Try moves</button><label id="promotion-label" hidden>Promote to <select id="promotion"><option value="q">Queen</option><option value="r">Rook</option><option value="b">Bishop</option><option value="n">Knight</option></select></label></div>
    <div class="moves-title"><strong>Moves</strong><button id="critical">Next mistake</button></div>
    <div id="moves" class="moves" aria-label="Move list"></div>
    <nav aria-label="Move navigation">
      <button data-nav="first" aria-label="Starting position" title="Starting position">⏮</button>
      <button data-nav="prev" aria-label="Previous move" title="Previous move">←</button>
      <button data-nav="next" aria-label="Next move" title="Next move">→</button>
      <button data-nav="last" aria-label="Final position" title="Final position">⏭</button>
      <button id="flip" aria-label="Flip board" title="Flip board">⇅</button>
    </nav>
  </section>
</main>
<dialog id="importer">
  <form id="import-form">
    <h2>Import game</h2>
    <label for="pgn">Paste the PGN from Share → PGN on Chess.com</label>
    <textarea id="pgn" rows="9" spellcheck="false" placeholder='[Event "Live Chess"]'></textarea>
    <label for="file">Or choose a .pgn file</label>
    <input id="file" type="file" accept=".pgn,text/plain">
    <p id="import-error" role="alert"></p>
    <div class="dialog-actions"><button id="close" type="button">Cancel</button><button class="primary" type="submit">Load game</button></div>
  </form>
</dialog>
<script type="module" src="app.mjs"></script>
</html>
