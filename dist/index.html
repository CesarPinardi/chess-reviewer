<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Revise suas partidas de xadrez com Stockfish no navegador.">
<title>Revisor de Xadrez</title>
<link rel="stylesheet" href="style.css">
<header><span class="logo" aria-hidden="true">♞</span><strong>Revisor de Xadrez</strong><button id="open" type="button">Importar PGN</button></header>
<main>
  <section class="play" aria-label="Tabuleiro e gráfico">
    <div class="player" id="top"></div>
    <div class="arena">
      <div class="meter" title="Avaliação das brancas"><div id="balance"></div><span id="score">—</span></div>
      <div class="board-wrap"><div id="board" aria-label="Tabuleiro"></div><svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg></div>
    </div>
    <div class="player" id="bottom"></div>
    <div class="plot">
      <div class="plot-title"><strong>Avaliação da partida</strong><span>Stockfish 17.1</span></div>
      <canvas id="chart" aria-label="Gráfico de avaliação. Use a lista de lances para navegar pelo teclado."></canvas>
    </div>
  </section>
  <section class="review" aria-label="Revisão da partida">
    <div class="intro"><div class="caption">ANÁLISE DE PARTIDA</div><h1>Revisão da partida</h1><p id="game"></p></div>
    <div class="actions"><button id="analyze" class="primary">Analisar partida</button><progress id="progress" hidden></progress><p id="status" role="status"></p></div>
    <section id="report" class="report" aria-labelledby="report-title" hidden>
      <h2 id="report-title">Resumo da partida</h2>
      <table>
        <thead><tr><th scope="col">Classificação</th><th scope="col">Brancas</th><th scope="col">Pretas</th></tr></thead>
        <tbody id="report-counts"></tbody>
      </table>
    </section>
    <div class="detail" id="detail" aria-live="polite"></div>
    <div class="moves-title"><strong>Lances</strong><button id="critical">Próximo erro</button></div>
    <div id="moves" class="moves" aria-label="Lista de lances"></div>
    <nav aria-label="Navegação pelos lances">
      <button data-nav="first" aria-label="Primeira posição" title="Primeira posição">⏮</button>
      <button data-nav="prev" aria-label="Voltar um lance" title="Voltar um lance">←</button>
      <button data-nav="next" aria-label="Avançar um lance" title="Avançar um lance">→</button>
      <button data-nav="last" aria-label="Última posição" title="Última posição">⏭</button>
      <button id="flip" aria-label="Girar tabuleiro" title="Girar tabuleiro">⇅</button>
    </nav>
  </section>
</main>
<dialog id="importer">
  <form id="import-form">
    <h2>Importar partida</h2>
    <label for="pgn">Cole o PGN de Share → PGN no Chess.com</label>
    <textarea id="pgn" rows="9" spellcheck="false" placeholder='[Event "Live Chess"]'></textarea>
    <label for="file">Ou selecione um arquivo .pgn</label>
    <input id="file" type="file" accept=".pgn,text/plain">
    <p id="import-error" role="alert"></p>
    <div class="dialog-actions"><button id="close" type="button">Cancelar</button><button class="primary" type="submit">Carregar partida</button></div>
  </form>
</dialog>
<script type="module" src="app.mjs"></script>
</html>
